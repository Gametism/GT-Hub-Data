# Takes a Sidewarden suggestion into sidewarden-data.txt.
#
# A suggestion is an issue that Sidewarden' "Suggest For Everyone" opened ("Launch arguments for ..." or
# "CPU cores for ..."), with its line under "Line for the list:". It is taken over
#   - at once, when the repository's owner opened it, and
#   - when someone who may label issues gives it the label "approved" (anybody can open an issue; only the
#     owner and collaborators can label one, so nothing gets into the list that nobody looked at).
# Editing the issue takes the edited line over (a line for the same game and arguments is replaced).
# Where the line still says "(what it does)", what was written under "What they do" takes its place.
# The line is checked by the rules Sidewarden reads the list with (.github/scripts/add_suggestion.py); one
# that breaks a rule gets a comment that says which, and the issue stays open to be edited.
# Every Sidewarden reads the list once a day at most, so a line taken over is offered a day later at most.
name: Take a suggestion into the list

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: sidewarden-data
  cancel-in-progress: false

jobs:
  take:
    if: >-
      github.event.issue.state == 'open' &&
      (github.event.issue.author_association == 'OWNER' || contains(github.event.issue.labels.*.name, 'approved'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the line and put it into the list
        id: take
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 .github/scripts/add_suggestion.py

      - name: Keep the list
        if: steps.take.outputs.result == 'added' || steps.take.outputs.result == 'updated'
        env:
          NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sidewarden-data.txt
          git commit -m "Take over #$NUMBER"
          git push

      - name: Say so on the issue
        if: steps.take.outputs.result != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.take.outputs.result }}
          LINE: ${{ steps.take.outputs.line }}
          REASON: ${{ steps.take.outputs.reason }}
        run: |
          case "$RESULT" in
            added|updated|already)
              printf 'In the list now:\n\n```\n%s\n```\n\nEvery Sidewarden offers it within a day.\n' "$LINE" > comment.md
              gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md
              gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed ;;
            invalid)
              printf 'Not taken into the list yet: %s.\n\nEdit the line under "Line for the list:" and it is taken over.\n' "$REASON" > comment.md
              gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body-file comment.md ;;
          esac
